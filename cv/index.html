<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    :root { --muted:#3d4248; --panel:#2c3237; --panel-text:#f7f9fb; --rule:#dadde0; }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(140deg,#d6dbe2 0%,#edf1f4 45%,#d2d8df 100%);font-size:11pt;line-height:1.35}
    .shell{padding:22px 12px 34px}.actions{max-width:1200px;margin:0 auto 12px;display:flex;justify-content:flex-end}
    .btn{border:0;border-radius:999px;background:#1f2937;color:#fff;padding:10px 16px;font-size:13px;font-weight:600;text-decoration:none}
    .page{max-width:1200px;margin:0 auto;background:#fff;border-radius:4px;box-shadow:0 8px 28px rgba(15,23,42,.2),0 2px 8px rgba(15,23,42,.12)}
    .header{padding:22mm 16mm 8mm;border-bottom:1px solid var(--rule)} .header h1{margin:0;font-size:28pt;font-weight:800} .header h2{margin:2mm 0 0;font-size:14pt;font-weight:500}
    .header-summary{margin-top:5mm;font-size:11pt;line-height:1.45}
    .contact-bar{display:grid;grid-template-columns:repeat(3,minmax(120px,1fr));background:var(--panel);color:var(--panel-text);padding:18px 16mm}
    .contact-item{padding:8px 0;font-size:11pt;display:flex;align-items:center;gap:8px;overflow-wrap:anywhere}
    .content{display:grid;grid-template-columns:1.55fr .75fr;gap:12mm;padding:12mm 16mm 16mm}
    .section{margin-bottom:22px}.section h3{margin:0 0 8px;font-size:13pt;font-weight:700}.entry{margin-bottom:16px}
    .entry-title{margin:0;font-size:12pt;font-weight:700}.entry-meta{margin:2px 0 0;font-size:11.5pt;font-weight:500}.entry-date{margin-top:4px;font-size:10.5pt;color:var(--muted)}
    .entry-content{margin-top:8px;font-size:11pt;line-height:1.45}.entry-content p{margin:0 0 8px}
    .entry-content ul,.entry-content ol{margin:0;padding-left:0;list-style:none}.entry-content li{margin:0 0 5px;padding-left:12px;position:relative}.entry-content li::before{content:"•";position:absolute;left:0}
    .footer{grid-column:1/-1;margin-top:8px}.tech-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tech-grid .entry{margin-bottom:0}
    .error{margin:20px;background:#fceaea;border:1px solid #f0c5c5;color:#8b1111;border-radius:8px;padding:12px}
    @media (max-width:920px){.content{grid-template-columns:1fr}.contact-bar{grid-template-columns:1fr}.tech-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="actions"><a class="btn" id="pdf-link" href="#" target="_blank" rel="noopener noreferrer">View PDF</a></div>
    <main class="page">
      <header class="header" id="header"></header>
      <section class="contact-bar" id="contact"></section>
      <section class="content"><div id="main-col"></div><div id="rail-col"></div><div class="footer" id="footer-col"></div></section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    const slug=(new URLSearchParams(location.search).get('cv')||'').trim().toLowerCase();
    const basePath=location.pathname.replace(/\/cv\/?$/,'');
    const key=(v)=>String(v||'').trim().toLowerCase();
    const sortItems=(items)=>[...(items||[])].sort((a,b)=>String(a?.manualsort||'').localeCompare(String(b?.manualsort||''),undefined,{numeric:true,sensitivity:'base'}));
    const md=(v)=>{const t=String(v||'');if(!t)return '';if(window.marked?.parse)return window.marked.parse(t);return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');};
    const ddate=(i)=>i?.dispdate||(i?.start?`${i.start} – ${i?.end||'Present'}`:'');
    const icon=(t)=>{const v=String(t||'').toLowerCase();if(v.includes('@'))return 'fa-solid fa-envelope';if(v.includes('http')||v.includes('www.'))return 'fa-solid fa-globe';if(/[+()\d\s-]{7,}/.test(v))return 'fa-solid fa-phone';return 'fa-solid fa-address-card';};

    function entry(item, hideTitle=false){
      const a=document.createElement('article');a.className='entry';
      if(item?.title&&!hideTitle){const h=document.createElement('h4');h.className='entry-title';h.textContent=item.title;a.appendChild(h);}
      const meta=[item?.subtitle,item?.location].filter(Boolean).join(' • '); if(meta){const m=document.createElement('div');m.className='entry-meta';m.textContent=meta;a.appendChild(m);}
      const date=ddate(item); if(date){const e=document.createElement('div');e.className='entry-date';e.textContent=date;a.appendChild(e);}
      if(item?.content){const c=document.createElement('div');c.className='entry-content';c.innerHTML=md(item.content);a.appendChild(c);}
      return a;
    }
    function section(host,title,items,opt={}){if(!items.length)return;const s=document.createElement('section');s.className='section';if(!opt.hideSectionTitle){const h=document.createElement('h3');h.textContent=title;s.appendChild(h);}items.forEach(i=>s.appendChild(entry(i,opt.hideAllEntryTitles||false)));host.appendChild(s);}

    function render(items){
      const header=items.find(i=>key(i.section)==='header')||{};
      const contacts=items.filter(i=>key(i.section)==='contact');
      document.getElementById('header').innerHTML=`<h1>${header?.title||'CV'}</h1><h2>${header?.subtitle||''}</h2><div class="header-summary">${md(header?.content||'')}</div>`;
      document.getElementById('contact').innerHTML=contacts.map(i=>`<div class="contact-item"><i class="${icon(i?.content)}"></i><span>${i?.content||''}</span></div>`).join('');

      const grouped=new Map();
      items.forEach(i=>{const s=key(i.section);if(!s||s==='header'||s==='contact')return;if(!grouped.has(s))grouped.set(s,[]);grouped.get(s).push(i);});
      const main=document.getElementById('main-col'), rail=document.getElementById('rail-col'), footer=document.getElementById('footer-col');
      main.innerHTML=''; rail.innerHTML=''; footer.innerHTML='';

      section(main,'Core Competencies',sortItems(grouped.get('core competencies')||[]),{hideAllEntryTitles:true});
      section(main,'Work Experience',sortItems(grouped.get('work experience')||[]));
      section(main,'Topline Skills',sortItems(grouped.get('topline skills')||[]));
      const tech=sortItems(grouped.get('technical + it')||[]); if(tech.length){const w=document.createElement('section');w.className='section';w.innerHTML='<h3>Technical + IT</h3><div class="tech-grid"></div>';const g=w.querySelector('.tech-grid');tech.forEach(i=>g.appendChild(entry(i)));footer.appendChild(w);}
      section(rail,'Education',sortItems(grouped.get('education')||[]));
      sortItems(grouped.get('second page rail')||[]).forEach(i=>section(rail,i?.title||'Second Page Rail',[{...i,title:''}],{hideAllEntryTitles:true}));
      section(footer,'CV Footer',sortItems(grouped.get('footer')||[]),{hideSectionTitle:true,hideAllEntryTitles:true});
    }

    (async()=>{
      if(!slug){document.body.innerHTML='<div class="error">Missing <code>?cv=&lt;slug&gt;</code> query parameter.</div>';return;}
      try{
        const res=await fetch(`${basePath}/data/cv/${encodeURIComponent(slug)}.json`,{cache:'no-store'});
        if(!res.ok) throw new Error(`Unable to load ${basePath}/data/cv/${slug}.json (HTTP ${res.status})`);
        const cv=await res.json();
        render(Array.isArray(cv?.items)?cv.items:[]);
        document.getElementById('pdf-link').href=`${basePath}/dist/${encodeURIComponent(slug)}.pdf`;
      }catch(e){document.body.innerHTML=`<div class="error">${e.message||String(e)}</div>`;}
    })();
  </script>
</body>
</html>
