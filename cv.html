<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Viewer</title>
    <style>
      :root {
        --bg: #0b0f14;
        --surface: #121820;
        --surface-alt: #2f3842;
        --text: #d5dbe3;
        --muted: #9eaab8;
        --heading: #f0f4fa;
        --accent: #dde7f3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.45;
      }
      .page { max-width: 1200px; margin: 0 auto; min-height: 100vh; }
      .hero {
        min-height: 230px;
        background: linear-gradient(180deg, #06080c 0%, #0b0f14 100%);
        padding: 56px 56px 32px;
      }
      .hero h1 { margin: 0; font-size: 46px; color: var(--heading); letter-spacing: .2px; }
      .hero h2 { margin: 8px 0 0; font-size: 40px; color: #f7fbff; font-weight: 700; }
      .contact-bar {
        display: grid;
        grid-template-columns: repeat(3, minmax(180px, 1fr));
        background: var(--surface-alt);
        border-top: 1px solid #424c57;
        border-bottom: 1px solid #424c57;
      }
      .contact-item {
        padding: 14px 20px;
        color: #ebf0f7;
        text-decoration: none;
        border-right: 1px solid #424c57;
        overflow-wrap: anywhere;
      }
      .contact-item:last-child { border-right: 0; }
      .content { padding: 36px 56px 56px; display: grid; grid-template-columns: 1.25fr .75fr; gap: 56px; }
      .section { margin-bottom: 34px; }
      .section h3 {
        margin: 0 0 14px;
        color: var(--accent);
        font-size: 40px;
        letter-spacing: .2px;
      }
      .entry { margin-bottom: 24px; }
      .entry-title { margin: 0; font-size: 34px; color: #f6f9ff; }
      .entry-meta { color: var(--muted); font-size: 22px; margin: 4px 0 10px; }
      .entry-content {
        margin: 0;
        white-space: pre-wrap;
        font-size: 26px;
        color: #d7e0ea;
      }
      .entry-date { color: var(--muted); font-size: 20px; margin-top: 6px; }
      .chip { display: inline-block; border: 1px solid #4a5665; border-radius: 99px; padding: 3px 10px; font-size: 16px; margin-left: 8px; }
      .empty { color: var(--muted); padding: 24px 0; }
      .error { color: #ffd3d3; background: #3a1e1e; padding: 14px; border-radius: 8px; }
      @media (max-width: 900px) {
        .hero { padding: 36px 20px 20px; min-height: 160px; }
        .hero h1 { font-size: 36px; }
        .hero h2 { font-size: 30px; }
        .contact-bar { grid-template-columns: 1fr; }
        .contact-item { border-right: 0; border-bottom: 1px solid #424c57; }
        .contact-item:last-child { border-bottom: 0; }
        .content { padding: 24px 20px 40px; grid-template-columns: 1fr; gap: 20px; }
        .section h3 { font-size: 30px; }
        .entry-title { font-size: 24px; }
        .entry-content { font-size: 20px; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="hero" id="hero"></header>
      <section class="contact-bar" id="contact"></section>
      <section class="content">
        <div id="left-col"></div>
        <div id="right-col"></div>
      </section>
    </main>

    <script>
      const rightColumnSections = new Set([
        "skills",
        "education",
        "work eligibility",
        "languages",
        "soft skills",
        "references"
      ]);

      const query = new URLSearchParams(window.location.search);
      const slug = (query.get("cv") || "").trim().toLowerCase();

      function toSectionKey(value) {
        return String(value || "").trim().toLowerCase();
      }

      function parseDateValue(value) {
        if (!value) return Number.NEGATIVE_INFINITY;
        const n = Date.parse(String(value));
        return Number.isNaN(n) ? Number.NEGATIVE_INFINITY : n;
      }

      function sortSectionItems(items) {
        return [...items].sort((a, b) => {
          const startDiff = parseDateValue(b.start) - parseDateValue(a.start);
          if (startDiff !== 0) return startDiff;

          const endDiff = parseDateValue(b.end) - parseDateValue(a.end);
          if (endDiff !== 0) return endDiff;

          const aManual = Number.isFinite(Number(a.manualsort)) ? Number(a.manualsort) : Number.MAX_SAFE_INTEGER;
          const bManual = Number.isFinite(Number(b.manualsort)) ? Number(b.manualsort) : Number.MAX_SAFE_INTEGER;
          return aManual - bManual;
        });
      }

      function renderHero(headerItem) {
        const hero = document.getElementById("hero");
        hero.innerHTML = `
          <h1>${headerItem?.title || "CV"}</h1>
          <h2>${headerItem?.subtitle || ""}</h2>
          <p class="entry-content" style="margin-top:18px;max-width:900px;">${headerItem?.content || ""}</p>
        `;
      }

      function renderContact(contactItems) {
        const host = document.getElementById("contact");
        if (!contactItems.length) {
          host.innerHTML = "";
          host.style.display = "none";
          return;
        }
        host.innerHTML = "";
        contactItems.forEach((item) => {
          const el = document.createElement("div");
          el.className = "contact-item";
          el.textContent = `${item.title || ""}: ${item.content || ""}`;
          host.appendChild(el);
        });
      }

      function sectionTitle(sectionKey) {
        return sectionKey
          .split(/\s+/)
          .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
          .join(" ");
      }

      function renderEntry(item) {
        const wrap = document.createElement("article");
        wrap.className = "entry";

        const title = document.createElement("h4");
        title.className = "entry-title";
        title.textContent = item.title || "";
        wrap.appendChild(title);

        if (item.subtitle || item.location) {
          const meta = document.createElement("div");
          meta.className = "entry-meta";
          meta.textContent = [item.subtitle, item.location].filter(Boolean).join(" • ");
          wrap.appendChild(meta);
        }

        if (item.content) {
          const content = document.createElement("p");
          content.className = "entry-content";
          content.textContent = item.content;
          wrap.appendChild(content);
        }

        if (item.start || item.end || item.dispdate) {
          const date = document.createElement("div");
          date.className = "entry-date";
          date.textContent = item.dispdate || [item.start, item.end].filter(Boolean).join(" → ");
          if (item.manualsort !== undefined && item.manualsort !== null && item.manualsort !== "") {
            const chip = document.createElement("span");
            chip.className = "chip";
            chip.textContent = `#${item.manualsort}`;
            date.appendChild(chip);
          }
          wrap.appendChild(date);
        }

        return wrap;
      }

      function renderSections(items) {
        const sections = new Map();
        items.forEach((item) => {
          const key = toSectionKey(item.section);
          if (!key) return;
          if (!sections.has(key)) sections.set(key, []);
          sections.get(key).push(item);
        });

        const left = document.getElementById("left-col");
        const right = document.getElementById("right-col");
        left.innerHTML = "";
        right.innerHTML = "";

        if (!sections.size) {
          left.innerHTML = '<p class="empty">No section items found in this CV JSON.</p>';
          return;
        }

        [...sections.entries()].forEach(([sectionKey, sectionItems]) => {
          const sorted = sortSectionItems(sectionItems);
          const block = document.createElement("section");
          block.className = "section";

          const heading = document.createElement("h3");
          heading.textContent = sectionTitle(sectionKey);
          block.appendChild(heading);

          sorted.forEach((item) => block.appendChild(renderEntry(item)));

          if (rightColumnSections.has(sectionKey)) {
            right.appendChild(block);
          } else {
            left.appendChild(block);
          }
        });
      }

      async function init() {
        if (!slug) {
          document.getElementById("hero").innerHTML = '<div class="error">Missing <code>?cv=&lt;slug&gt;</code> query parameter.</div>';
          document.getElementById("contact").style.display = "none";
          return;
        }

        try {
          const res = await fetch(`data/cv/${encodeURIComponent(slug)}.json`, { cache: "no-store" });
          if (!res.ok) throw new Error(`Unable to load data/cv/${slug}.json (HTTP ${res.status})`);
          const cv = await res.json();
          const allItems = Array.isArray(cv.items) ? cv.items : [];
          const headerItem = allItems.find((item) => toSectionKey(item.section) === "header") || {};
          const contactItems = allItems.filter((item) => toSectionKey(item.section) === "contact");
          const sectionItems = allItems.filter((item) => {
            const key = toSectionKey(item.section);
            return key && key !== "header" && key !== "contact";
          });

          renderHero(headerItem);
          renderContact(contactItems);
          renderSections(sectionItems);
        } catch (err) {
          document.getElementById("hero").innerHTML = `<div class="error">${err.message}</div>`;
          document.getElementById("contact").style.display = "none";
        }
      }

      init();
    </script>
  </body>
</html>
