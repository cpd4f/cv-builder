<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CV Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      :root {
        --bg: #ffffff;
        --text: #000000;
        --muted: #3d4248;
        --panel: #2c3237;
        --panel-text: #f7f9fb;
        --rule: #dadde0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--text);
        background: linear-gradient(140deg, #d6dbe2 0%, #edf1f4 45%, #d2d8df 100%);
        line-height: 1.35;
        font-size: 11pt;
      }

      .shell {
        padding: 22px 12px 34px;
      }

      .actions {
        max-width: 1200px;
        margin: 0 auto 12px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }
      .btn {
        border: 0;
        border-radius: 999px;
        background: #1f2937;
        color: #fff;
        padding: 10px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(31, 41, 55, 0.25);
      }
      .btn:hover { background: #111827; }

      .page {
        max-width: 1200px;
        margin: 0 auto;
        background: #fff;
        border-radius: 4px;
        box-shadow: 0 8px 28px rgba(15, 23, 42, 0.2), 0 2px 8px rgba(15, 23, 42, 0.12);
      }

      .header { padding: 22mm 16mm 8mm; border-bottom: 1px solid var(--rule); }
      .header h1 {
        margin: 0;
        font-size: 28pt;
        font-weight: 800;
        letter-spacing: 0.02em;
        text-align: left;
      }
      .header h2 {
        margin: 2mm 0 0;
        font-size: 14pt;
        font-weight: 500;
        text-align: left;
      }
      .header-summary {
        margin-top: 5mm;
        font-size: 11pt;
        line-height: 1.45;
      }

      .contact-bar {
        display: grid;
        grid-template-columns: repeat(3, minmax(120px, 1fr));
        background: var(--panel);
        color: var(--panel-text);
        padding: 18px 16mm;
      }
      .contact-item {
        padding: 8px 0;
        border-right: 1px solid #4b555f;
        font-size: 11pt;
        overflow-wrap: anywhere;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .contact-item i { width: 14px; text-align: center; }
      .contact-item:first-child { padding-right: 16px; }
      .contact-item:last-child { border-right: 0; padding-left: 16px; }

      .content {
        display: grid;
        grid-template-columns: 1.55fr 0.75fr;
        gap: 12mm;
        padding: 12mm 16mm 16mm;
      }
      .section { margin-bottom: 22px; }
      .section h3 {
        margin: 0 0 8px;
        font-size: 13pt;
        font-weight: 700;
      }
      .entry { margin-bottom: 16px; }
      .entry-title {
        margin: 0;
        font-size: 12pt;
        font-weight: 700;
      }
      .entry-meta {
        margin: 2px 0 0;
        font-size: 11.5pt;
        font-weight: 500;
      }
      .entry-date {
        margin-top: 4px;
        font-size: 10.5pt;
        color: var(--muted);
      }
      .entry-content {
        margin-top: 8px;
        font-size: 11pt;
        line-height: 1.45;
      }
      .entry-content p { margin: 0 0 8px; }
      .entry-content ul, .entry-content ol {
        margin: 0;
        padding-left: 0;
        list-style: none;
      }
      .entry-content li {
        margin: 0 0 5px;
        padding-left: 12px;
        position: relative;
      }
      .entry-content li::before {
        content: "•";
        position: absolute;
        left: 0;
      }

      .error {
        margin: 20px;
        background: #fceaea;
        border: 1px solid #f0c5c5;
        color: #8b1111;
        border-radius: 8px;
        padding: 12px;
      }

      #pdf-render-root {
        position: fixed;
        top: -10000px;
        left: -10000px;
        width: 210mm;
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }

      .pdf-page {
        --pdf-margin: 10mm;
        width: 210mm;
        height: 297mm;
        background: #fff;
        color: #000;
        padding: var(--pdf-margin);
        page-break-after: always;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-size: 12px;
      }
      .pdf-page:last-child { page-break-after: auto; }
      .pdf-page .header { padding: 0 0 5mm; }
      .pdf-page .header-summary { margin-top: 3.5mm; }
      .pdf-page .contact-bar {
        margin-left: calc(-1 * var(--pdf-margin));
        margin-right: calc(-1 * var(--pdf-margin));
        padding: 4mm var(--pdf-margin);
      }
      .pdf-grid {
        flex: 1;
        margin-top: 7mm;
        display: grid;
        grid-template-columns: 1.75fr 1fr;
        gap: 8mm;
        min-height: 0;
      }
      .pdf-main, .pdf-rail {
        min-height: 0;
        overflow: hidden;
      }
      .pdf-main {
        font-size: 12px;
      }
      .pdf-rail {
        font-size: 10.5px;
      }
      .pdf-rail .section h3 {
        font-size: 12px;
      }
      .pdf-rail .entry-title {
        font-size: 11px;
      }
      .pdf-rail .entry-meta {
        font-size: 10px;
      }
      .pdf-rail .entry-content {
        font-size: 10px;
      }
      .pdf-section { margin-bottom: 16px; break-inside: avoid; }
      .pdf-page .section h3 { font-size: 14px; }
      .pdf-page .entry-title { font-size: 13px; }
      .pdf-page .entry-meta { font-size: 12px; }
      .pdf-page .entry-date { font-size: 12px; }
      .pdf-page .entry-content { font-size: 12px; line-height: 1.38; }
      .pdf-page .pdf-rail .section h3 { font-size: 12px; }
      .pdf-page .pdf-rail .entry-content { font-size: 10px; }
      .pdf-page .pdf-rail .entry-meta { font-size: 10px; }
      .pdf-page .pdf-rail .entry-title { font-size: 11px; }
      .pdf-entry { margin-bottom: 12px; break-inside: avoid; }

      @media (max-width: 920px) {
        .actions { justify-content: center; flex-wrap: wrap; }
        .content { grid-template-columns: 1fr; gap: 6mm; }
        .contact-bar { grid-template-columns: 1fr; }
        .contact-item { border-right: 0; border-bottom: 1px solid #4b555f; }
        .contact-item:last-child { border-bottom: 0; padding-left: 0; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="actions">
        <button class="btn" id="download-btn">Download</button>
        <button class="btn" id="print-btn">Print</button>
        <button class="btn" id="share-btn">Share</button>
      </div>

      <main class="page">
        <header class="header" id="header"></header>
        <section class="contact-bar" id="contact"></section>
        <section class="content">
          <div id="main-col"></div>
          <div id="rail-col"></div>
        </section>
      </main>
    </div>

    <div id="pdf-render-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      const query = new URLSearchParams(window.location.search);
      const slug = (query.get("cv") || "").trim().toLowerCase();
      let currentCv = null;

      function key(value) { return String(value || "").trim().toLowerCase(); }
      function parseDateValue(value) {
        if (!value) return Number.NEGATIVE_INFINITY;
        const timestamp = Date.parse(String(value));
        return Number.isNaN(timestamp) ? Number.NEGATIVE_INFINITY : timestamp;
      }
      function sortItems(items) {
        return [...items].sort((a, b) => {
          const aManual = String(a.manualsort || "").trim();
          const bManual = String(b.manualsort || "").trim();
          if (aManual && bManual && aManual !== bManual) {
            return aManual.localeCompare(bManual, undefined, { numeric: true, sensitivity: "base" });
          }
          if (aManual && !bManual) return -1;
          if (!aManual && bManual) return 1;

          const byStart = parseDateValue(b.start) - parseDateValue(a.start);
          if (byStart !== 0) return byStart;
          const byEnd = parseDateValue(b.end) - parseDateValue(a.end);
          if (byEnd !== 0) return byEnd;
          return 0;
        });
      }
      function titleCase(value) {
        return String(value || "").split(/\s+/).filter(Boolean).map((part) => part.charAt(0).toUpperCase() + part.slice(1)).join(" ");
      }
      function markdownToHtml(markdown) {
        const raw = String(markdown || "").trim();
        if (!raw) return "";
        if (window.marked) return window.marked.parse(raw, { breaks: true });
        return raw.replace(/\n/g, "<br />");
      }

      function formatApDate(value) {
        const input = String(value || "").trim();
        if (!input) return "";
        const date = new Date(input);
        if (Number.isNaN(date.getTime())) return input;
        const months = ["Jan.", "Feb.", "Mar.", "Apr.", "May", "Jun.", "Jul.", "Aug.", "Sep.", "Oct.", "Nov.", "Dec."];
        return `${months[date.getMonth()]} ${date.getFullYear()}`;
      }

      function displayDate(item) {
        if (item.dispdate) return String(item.dispdate);
        const start = formatApDate(item.start);
        const end = formatApDate(item.end);
        if (start && end) return `${start} – ${end}`;
        if (start) return `Since ${start}`;
        return end;
      }

      function contactIconClass(title) {
        const t = String(title || "").trim().toLowerCase();
        if (t === "email") return "fa-solid fa-envelope";
        if (t === "website") return "fa-solid fa-link";
        if (t === "phone") return "fa-solid fa-phone";
        return "fa-solid fa-circle-info";
      }

      function renderHeader(item) {
        const host = document.getElementById("header");
        host.innerHTML = `
          <h1>${item?.title || "CV"}</h1>
          <h2>${item?.subtitle || ""}</h2>
          <div class="header-summary">${markdownToHtml(item?.content || "")}</div>
        `;
      }

      function renderContact(items) {
        const host = document.getElementById("contact");
        const entries = items.filter((item) => String(item?.content || "").trim() !== "");
        if (!entries.length) {
          host.style.display = "none";
          return;
        }
        host.innerHTML = "";
        entries.forEach((item) => {
          const el = document.createElement("div");
          el.className = "contact-item";
          el.innerHTML = `<i class="${contactIconClass(item.title)}" aria-hidden="true"></i><span>${item.content || ""}</span>`;
          host.appendChild(el);
        });
      }

      function renderEntry(item, classPrefix = "") {
        const wrap = document.createElement("article");
        wrap.className = `${classPrefix}entry`.trim();

        if (item.title) {
          const title = document.createElement("h4");
          title.className = "entry-title";
          title.textContent = item.title;
          wrap.appendChild(title);
        }
        if (item.subtitle || item.location) {
          const meta = document.createElement("div");
          meta.className = "entry-meta";
          meta.textContent = [item.subtitle, item.location].filter(Boolean).join(" • ");
          wrap.appendChild(meta);
        }
        if (item.start || item.end || item.dispdate) {
          const date = document.createElement("div");
          date.className = "entry-date";
          date.textContent = displayDate(item);
          wrap.appendChild(date);
        }
        if (item.content) {
          const content = document.createElement("div");
          content.className = "entry-content";
          content.innerHTML = markdownToHtml(item.content);
          wrap.appendChild(content);
        }
        return wrap;
      }

      function renderSection(host, sectionName, items) {
        if (!items.length) return;
        const section = document.createElement("section");
        section.className = "section";
        const heading = document.createElement("h3");
        heading.textContent = sectionName;
        section.appendChild(heading);
        sortItems(items).forEach((item) => section.appendChild(renderEntry(item)));
        host.appendChild(section);
      }

      function renderSecondPageRail(host, items) {
        sortItems(items).forEach((item) => {
          if (!item.title) return;
          const section = document.createElement("section");
          section.className = "section";
          const heading = document.createElement("h3");
          heading.textContent = item.title;
          section.appendChild(heading);
          if (item.content) {
            const body = document.createElement("div");
            body.className = "entry-content";
            body.innerHTML = markdownToHtml(item.content);
            section.appendChild(body);
          }
          host.appendChild(section);
        });
      }

      function groupBySection(items) {
        const grouped = new Map();
        items.forEach((item) => {
          const section = key(item.section);
          if (!section || section === "header" || section === "contact") return;
          if (!grouped.has(section)) grouped.set(section, []);
          grouped.get(section).push(item);
        });
        return grouped;
      }

      function renderWebColumns(items) {
        const grouped = groupBySection(items);
        const mainHost = document.getElementById("main-col");
        const railHost = document.getElementById("rail-col");
        mainHost.innerHTML = "";
        railHost.innerHTML = "";

        const mainConfig = [
          { key: "work experience", title: "Work Experience" },
          { key: "technical + it", title: "Technical + IT" }
        ];
        const railConfig = [
          { key: "topline skills", title: "Skills" },
          { key: "education", title: "Education" },
          { key: "second page rail", title: null }
        ];

        mainConfig.forEach((cfg) => {
          const sectionItems = grouped.get(cfg.key) || [];
          if (sectionItems.length) renderSection(mainHost, cfg.title, sectionItems);
          grouped.delete(cfg.key);
        });

        railConfig.forEach((cfg) => {
          const sectionItems = grouped.get(cfg.key) || [];
          if (!sectionItems.length) {
            grouped.delete(cfg.key);
            return;
          }
          if (cfg.key === "second page rail") {
            renderSecondPageRail(railHost, sectionItems);
          } else {
            renderSection(railHost, cfg.title, sectionItems);
          }
          grouped.delete(cfg.key);
        });

        [...grouped.keys()].sort().forEach((extraKey) => {
          renderSection(mainHost, titleCase(extraKey), grouped.get(extraKey));
        });
      }

      function buildPdfHeader(page, headerItem, contactItems) {
        const header = document.createElement("header");
        header.className = "header";
        header.innerHTML = `
          <h1>${headerItem?.title || "CV"}</h1>
          <h2>${headerItem?.subtitle || ""}</h2>
          <div class="header-summary">${markdownToHtml(headerItem?.content || "")}</div>
        `;
        page.appendChild(header);

        const contact = document.createElement("section");
        contact.className = "contact-bar";
        const entries = contactItems.filter((item) => String(item?.content || "").trim());
        entries.forEach((item) => {
          const el = document.createElement("div");
          el.className = "contact-item";
          el.innerHTML = `<i class="${contactIconClass(item.title)}" aria-hidden="true"></i><span>${item.content || ""}</span>`;
          contact.appendChild(el);
        });
        page.appendChild(contact);
      }

      function createPdfPage({ headerItem, contacts, includeHeader = false }) {
        const page = document.createElement("div");
        page.className = "pdf-page";

        if (includeHeader) buildPdfHeader(page, headerItem, contacts);

        const grid = document.createElement("section");
        grid.className = "pdf-grid";
        const main = document.createElement("div");
        main.className = "pdf-main";
        const rail = document.createElement("aside");
        rail.className = "pdf-rail";
        grid.append(main, rail);
        page.appendChild(grid);

        return { page, main, rail };
      }

      function sectionWithEntries(sectionTitle, items) {
        const section = document.createElement("section");
        section.className = "pdf-section section";
        section.innerHTML = `<h3>${sectionTitle}</h3>`;
        sortItems(items).forEach((item) => {
          section.appendChild(renderEntry(item, "pdf-"));
        });
        return section;
      }

      function appendSecondPageRail(host, items) {
        sortItems(items).forEach((item) => {
          if (!item.title) return;
          const block = document.createElement("section");
          block.className = "pdf-section section";
          block.innerHTML = `<h3>${item.title}</h3>`;
          if (item.content) {
            const body = document.createElement("div");
            body.className = "entry-content";
            body.innerHTML = markdownToHtml(item.content);
            block.appendChild(body);
          }
          host.appendChild(block);
        });
      }

      function splitWorkForFirstPage(workItems, headerItem, contacts, skillsItems) {
        const orderedWork = sortItems(workItems);
        if (!orderedWork.length) return { firstPage: [], overflow: [] };

        const root = document.getElementById("pdf-render-root");
        const draft = createPdfPage({ headerItem, contacts, includeHeader: true });
        root.appendChild(draft.page);

        if (skillsItems.length) {
          draft.rail.appendChild(sectionWithEntries("Skills", skillsItems));
        }

        const section = document.createElement("section");
        section.className = "pdf-section section";
        section.innerHTML = "<h3>Work Experience</h3>";
        draft.main.appendChild(section);

        const maxMainHeight = draft.main.clientHeight;
        const firstPage = [];
        const overflow = [];
        let overflowStarted = false;

        orderedWork.forEach((item) => {
          if (overflowStarted) {
            overflow.push(item);
            return;
          }

          const entry = renderEntry(item, "pdf-");
          section.appendChild(entry);
          const fits = draft.main.scrollHeight <= maxMainHeight;
          if (fits || firstPage.length === 0) {
            firstPage.push(item);
          } else {
            entry.remove();
            overflow.push(item);
            overflowStarted = true;
          }
        });

        draft.page.remove();
        return { firstPage, overflow };
      }

      function createPdfPlan(cv) {
        const items = Array.isArray(cv.items) ? cv.items : [];
        const headerItem = items.find((item) => key(item.section) === "header") || {};
        const contacts = items.filter((item) => key(item.section) === "contact");
        const grouped = groupBySection(items);

        const work = grouped.get("work experience") || [];
        const skills = grouped.get("topline skills") || [];
        const technical = grouped.get("technical + it") || [];
        const education = grouped.get("education") || [];
        const secondRail = grouped.get("second page rail") || [];

        grouped.delete("work experience");
        grouped.delete("topline skills");
        grouped.delete("technical + it");
        grouped.delete("education");
        grouped.delete("second page rail");

        const { firstPage: workFirstPage, overflow: workOverflow } = splitWorkForFirstPage(work, headerItem, contacts, skills);
        const extras = [...grouped.keys()].sort().map((extraKey) => ({
          title: titleCase(extraKey),
          items: grouped.get(extraKey)
        }));

        return {
          headerItem,
          contacts,
          workFirstPage,
          workOverflow,
          skills,
          technical,
          education,
          secondRail,
          extras
        };
      }

      function markdownToPdfBlocks(markdown, options = {}) {
        const textSize = options.size || 12;
        const bulletSize = options.bulletSize || textSize;
        const lines = String(markdown || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
        const blocks = [];

        lines.forEach((line) => {
          if (line.startsWith("- ")) {
            blocks.push({ ul: [line.slice(2).trim()], fontSize: bulletSize, margin: [0, 0, 0, 2] });
            return;
          }
          const headingMatch = line.match(/^\*\*(.+)\*\*:?$/);
          if (headingMatch) {
            blocks.push({ text: headingMatch[1].trim(), bold: true, fontSize: textSize + 0.5, margin: [0, 4, 0, 2] });
            return;
          }
          blocks.push({ text: line.replace(/\*\*/g, ""), fontSize: textSize, margin: [0, 0, 0, 2] });
        });

        return blocks.length ? blocks : [{ text: "", fontSize: textSize }];
      }

      function buildPdfEntry(item, opts = {}) {
        const size = opts.size || 12;
        const titleSize = opts.titleSize || 13;
        const metaSize = opts.metaSize || 12;
        const dateSize = opts.dateSize || 12;
        const stack = [];

        if (item.title) stack.push({ text: item.title, bold: true, fontSize: titleSize, margin: [0, 0, 0, 1] });
        const meta = [item.subtitle, item.location].filter(Boolean).join(" • ");
        if (meta) stack.push({ text: meta, fontSize: metaSize, margin: [0, 0, 0, 1] });
        if (item.start || item.end || item.dispdate) stack.push({ text: displayDate(item), fontSize: dateSize, color: "#3d4248", margin: [0, 0, 0, 3] });

        if (item.content) stack.push(...markdownToPdfBlocks(item.content, { size, bulletSize: size }));

        return { unbreakable: true, margin: [0, 0, 0, 8], stack };
      }

      function buildPdfSection(title, items, opts = {}) {
        const section = [{ text: title, fontSize: opts.sectionSize || 14, bold: true, margin: [0, 0, 0, 6] }];
        sortItems(items).forEach((item) => section.push(buildPdfEntry(item, opts)));
        return section;
      }

      function buildSecondRailBlocks(items, opts = {}) {
        const blocks = [];
        sortItems(items).forEach((item) => {
          if (!item.title) return;
          blocks.push({ text: item.title, fontSize: opts.sectionSize || 12, bold: true, margin: [0, 0, 0, 4] });
          if (item.content) blocks.push(...markdownToPdfBlocks(item.content, { size: opts.size || 10 }));
          blocks.push({ text: "", margin: [0, 0, 0, 4] });
        });
        return blocks;
      }

      function createPdfDefinition(cv) {
        const plan = createPdfPlan(cv);
        const contactLine = plan.contacts
          .filter((item) => String(item?.content || "").trim())
          .map((item) => item.content)
          .join("      |      ");

        const page1Main = [];
        if (plan.workFirstPage.length) page1Main.push(...buildPdfSection("Work Experience", plan.workFirstPage, { sectionSize: 14, titleSize: 13, metaSize: 12, dateSize: 12, size: 12 }));

        const page1Rail = [];
        if (plan.skills.length) page1Rail.push(...buildPdfSection("Skills", plan.skills, { sectionSize: 12, titleSize: 11, metaSize: 10, dateSize: 10, size: 10 }));

        const page2Main = [];
        if (plan.workOverflow.length) page2Main.push(...buildPdfSection("Work Experience (Cont.)", plan.workOverflow, { sectionSize: 14, titleSize: 13, metaSize: 12, dateSize: 12, size: 12 }));
        if (plan.technical.length) page2Main.push(...buildPdfSection("Technical + IT", plan.technical, { sectionSize: 14, titleSize: 13, metaSize: 12, dateSize: 12, size: 12 }));
        plan.extras.forEach((extra) => page2Main.push(...buildPdfSection(extra.title, extra.items, { sectionSize: 14, titleSize: 13, metaSize: 12, dateSize: 12, size: 12 })));

        const page2Rail = [];
        if (plan.education.length) page2Rail.push(...buildPdfSection("Education", plan.education, { sectionSize: 12, titleSize: 11, metaSize: 10, dateSize: 10, size: 10 }));
        if (plan.secondRail.length) page2Rail.push(...buildSecondRailBlocks(plan.secondRail, { sectionSize: 12, size: 10 }));

        return {
          pageSize: "A4",
          pageMargins: [28, 24, 28, 24],
          defaultStyle: {
            font: "Roboto",
            fontSize: 12,
            lineHeight: 1.25
          },
          content: [
            {
              stack: [
                { text: plan.headerItem?.title || "CV", fontSize: 34, bold: true, margin: [0, 0, 0, 3] },
                { text: plan.headerItem?.subtitle || "", fontSize: 20, margin: [0, 0, 0, 8] },
                ...markdownToPdfBlocks(plan.headerItem?.content || "", { size: 12 }),
                {
                  canvas: [{ type: "rect", x: -28, y: 0, w: 595.28, h: 24, color: "#2c3237" }],
                  margin: [0, 10, 0, -24]
                },
                { text: contactLine, color: "#f7f9fb", margin: [0, 4, 0, 0], fontSize: 11, bold: true }
              ]
            },
            {
              margin: [0, 14, 0, 0],
              columns: [
                { width: "63%", stack: page1Main },
                { width: "37%", stack: page1Rail }
              ],
              columnGap: 20
            },
            {
              pageBreak: "before",
              columns: [
                { width: "63%", stack: page2Main },
                { width: "37%", stack: page2Rail }
              ],
              columnGap: 20
            }
          ]
        };
      }

      function generatePdf(cv) {
        const definition = createPdfDefinition(cv);
        return new Promise((resolve, reject) => {
          if (!window.pdfMake) {
            reject(new Error("PDF engine failed to load."));
            return;
          }
          window.pdfMake.createPdf(definition).getBlob((blob) => {
            resolve({
              blob,
              save: (name) => window.pdfMake.createPdf(definition).download(name)
            });
          });
        });
      }

      function setupActions(cv) {
        const personName = cv.items?.find((item) => key(item.section) === "header")?.title || "Coleman Davis";

        document.getElementById("share-btn").addEventListener("click", async () => {
          const url = window.location.href;
          const message = `Check out the CV of ${personName}: ${url}`;
          await navigator.clipboard.writeText(message);
          alert("Copied CV link to clipboard.");
        });

        document.getElementById("download-btn").addEventListener("click", async () => {
          const pdf = await generatePdf(cv);
          pdf.save(`${slug || "cv"}.pdf`);
        });

        document.getElementById("print-btn").addEventListener("click", async () => {
          const pdf = await generatePdf(cv);
          const blob = pdf.blob;
          const blobUrl = URL.createObjectURL(blob);
          const frame = document.createElement("iframe");
          frame.style.position = "fixed";
          frame.style.right = "0";
          frame.style.bottom = "0";
          frame.style.width = "0";
          frame.style.height = "0";
          frame.style.border = "0";
          frame.src = blobUrl;
          document.body.appendChild(frame);
          frame.onload = () => {
            frame.contentWindow?.focus();
            frame.contentWindow?.print();
            setTimeout(() => {
              URL.revokeObjectURL(blobUrl);
              frame.remove();
            }, 2000);
          };
        });
      }

      async function init() {
        if (!slug) {
          document.body.innerHTML = '<div class="error">Missing <code>?cv=&lt;slug&gt;</code> query parameter.</div>';
          return;
        }
        try {
          const response = await fetch(`data/cv/${encodeURIComponent(slug)}.json`, { cache: "no-store" });
          if (!response.ok) throw new Error(`Unable to load data/cv/${slug}.json (HTTP ${response.status})`);
          const cv = await response.json();
          currentCv = cv;
          const items = Array.isArray(cv.items) ? cv.items : [];
          const header = items.find((item) => key(item.section) === "header") || {};
          const contacts = items.filter((item) => key(item.section) === "contact");
          renderHeader(header);
          renderContact(contacts);
          renderWebColumns(items);
          setupActions(cv);
        } catch (error) {
          document.body.innerHTML = `<div class="error">${error.message}</div>`;
        }
      }

      init();
    </script>
  </body>
</html>
