name: Build CV JSON + PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cv-print.html"
      - "cv-print.css"
      - "cv-render.js"
      - "data/cv/**"
      - "scripts/**"
      - "package.json"
      - "vivliostyle.config.js"
      - ".github/workflows/build-cv-pdf.yml"
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    env:
      EXPECTED_ISSUE_AUTHOR: cpd4f

    steps:
      - name: Check guard conditions (issue runs)
        if: github.event_name == 'issues'
        id: guard
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_AUTHOR_URL: ${{ github.event.issue.user.html_url }}
        run: |
          normalize_user() {
            local value
            value="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            value="${value#@}"
            value="${value#https://github.com/}"
            value="${value#http://github.com/}"
            value="${value%/}"
            printf '%s' "$value"
          }

          expected="$(normalize_user "$EXPECTED_ISSUE_AUTHOR")"
          actual_login="$(normalize_user "$ISSUE_AUTHOR")"
          actual_from_url="$(normalize_user "$ISSUE_AUTHOR_URL")"

          title_ok=false
          author_ok=false

          issue_title_upper="$(printf '%s' "$ISSUE_TITLE" | tr '[:lower:]' '[:upper:]')"
          if [[ "$issue_title_upper" == CV_UPDATE* ]]; then
            title_ok=true
          fi

          if [[ "$actual_login" == "$expected" || "$actual_from_url" == "$expected" ]]; then
            author_ok=true
          fi

          if [[ "$title_ok" == true && "$author_ok" == true ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping issue automation: guard did not pass."
          fi

      - name: Stop early when issue guard fails
        if: github.event_name == 'issues' && steps.guard.outputs.should_run != 'true'
        run: exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build JSON for all published CVs (issue trigger)
        if: github.event_name == 'issues'
        env:
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          BUILD_ALL_CVS: "true"
        run: npm run build:json

      - name: Build JSON (best effort on push/manual)
        if: github.event_name != 'issues'
        run: npm run build:json || true

      - name: Build PDF files for all CV JSON slugs
        run: npm run pdf:build

      - name: Commit generated JSON + PDFs (issue trigger)
        if: github.event_name == 'issues'
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain data/cv dist)" ]; then
            echo "No JSON/PDF changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cv dist
          git commit -m "chore: update generated CV JSON and PDFs"

          branch="${GITHUB_REF_NAME:-main}"
          if [ -z "$branch" ]; then branch="main"; fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} to ${branch}"
            git fetch origin "$branch"
            git pull --rebase --autostash origin "$branch" || (git rebase --abort && false)
            if git push origin "HEAD:${branch}"; then
              echo "Push succeeded"
              exit 0
            fi
            sleep 2
          done

          echo "Failed to push JSON/PDF commit after retries"
          exit 1

      - name: Comment success
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ CV JSON/PDF pipeline completed. Outputs regenerated, committed, and pushed (if changes were present).`
            });

      - name: Label issue as Automation Completed
        if: github.event_name == 'issues' && success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['Automation Completed']
            });

      - name: Comment failure
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ CV JSON/PDF pipeline failed. Please review workflow logs: ${runUrl}`
            });

      - name: Label issue as Automation Failed
        if: github.event_name == 'issues' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['Automation Failed']
            });

      - name: Close issue after automation
        if: github.event_name == 'issues' && always() && !cancelled()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: dist/*.pdf
