name: Publish CV JSON

on:
  repository_dispatch:
    types: [publish_cv]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write CV JSON
        env:
          CV_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/publish-cv.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cv
          git diff --cached --quiet || git commit -m "Publish CV: ${{ github.event.client_payload.slug }}"
          git push
